<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Piggy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#2A1A1F;color:#FDF6F0;
  width:320px;padding-bottom:16px;
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;border-bottom:1px solid #3D2530;
}
.logo{font-size:18px;font-weight:700;color:#F4A0B5;letter-spacing:-0.5px}
#pig-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 16px 8px}
#pig-label{font-size:11px;color:#666;margin-top:6px;letter-spacing:0.05em;text-transform:uppercase}
.total-card{
  margin:0 16px 12px;
  background:#3D2530;border:1px solid #5a3040;border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
}
.total-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px}
.total-val{font-size:28px;font-weight:700;color:#F4A0B5;line-height:1}
.total-sub{font-size:11px;color:#666;margin-top:3px}
.decay-ring{position:relative;width:56px;height:56px}
.decay-ring svg{transform:rotate(-90deg)}
.decay-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:#F4A0B5;
}
.section-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#555;padding:0 16px 8px}
.site-row{display:flex;align-items:center;gap:10px;padding:5px 16px}
.site-fav{
  width:18px;height:18px;border-radius:4px;flex-shrink:0;
  background:#3D2530;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.site-fav img{width:16px;height:16px;border-radius:3px}
.site-name{flex:1;font-size:13px;color:#FDF6F0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-time{font-size:12px;color:#888;flex-shrink:0;min-width:44px;text-align:right}
.site-pct{font-size:10px;color:#555;flex-shrink:0;min-width:30px;text-align:right}
.bar-wrap{height:3px;background:#3D2530;border-radius:2px;margin:1px 16px 4px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width 0.4s ease}
.verdict{
  margin:12px 16px 0;background:#3D2530;border:1px solid #5a3040;
  border-radius:10px;padding:10px 12px;
  font-size:12px;color:#aaa;font-style:italic;line-height:1.5;text-align:center;
}
.open-btn{
  display:block;width:calc(100% - 32px);margin:12px 16px 0;
  padding:11px;background:#F4A0B5;color:#2A1A1F;
  border:none;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background 0.2s;
}
.open-btn:hover{background:#F4C5D3}
.empty{padding:20px 16px;text-align:center;color:#555;font-size:13px;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Piggy</div>
  <div id="date-str" style="font-size:11px;color:#555"></div>
</div>

<div id="pig-wrap">
  <svg id="pig-svg" viewBox="0 0 120 96" width="110" height="88" xmlns="http://www.w3.org/2000/svg">
    <ellipse id="p-body" cx="60" cy="74" rx="42" ry="22" fill="#F4A0B5"/>
    <ellipse id="p-head" cx="60" cy="48" rx="30" ry="28" fill="#F4A0B5"/>
    <ellipse cx="37" cy="30" rx="11" ry="8" fill="#F4A0B5" id="p-el"/>
    <ellipse cx="83" cy="30" rx="11" ry="8" fill="#F4A0B5" id="p-er"/>
    <ellipse cx="37" cy="30" rx="6" ry="4" fill="#F4C5D3"/>
    <ellipse cx="83" cy="30" rx="6" ry="4" fill="#F4C5D3"/>
    <ellipse cx="60" cy="58" rx="12" ry="9" fill="#F4C5D3"/>
    <circle cx="57" cy="58" r="2" fill="#D47090"/>
    <circle cx="63" cy="58" r="2" fill="#D47090"/>
    <circle id="p-eye-lw" cx="49" cy="42" r="5" fill="white"/>
    <circle cx="49" cy="42" r="2.5" fill="#2A1A1F" id="p-eye-lp"/>
    <circle id="p-eye-rw" cx="71" cy="42" r="5" fill="white"/>
    <circle cx="71" cy="42" r="2.5" fill="#2A1A1F" id="p-eye-rp"/>
    <path id="p-mouth" d="M53 52 Q60 57 67 52" stroke="#D47090" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="46" y="88" width="12" height="8" rx="5" fill="#F4A0B5"/>
    <rect x="62" y="88" width="12" height="8" rx="5" fill="#F4A0B5"/>
    <g id="p-wrinkles" opacity="0">
      <path d="M42 37 Q46 34 50 37" fill="none" stroke="#D47090" stroke-width="0.9" opacity="0.6"/>
      <path d="M70 37 Q74 34 78 37" fill="none" stroke="#D47090" stroke-width="0.9" opacity="0.6"/>
      <path d="M54 64 Q60 67 66 64" stroke="#D47090" stroke-width="1" fill="none" opacity="0.7"/>
    </g>
    <g id="p-bags" opacity="0">
      <path d="M45 47 Q49 50 53 47" fill="none" stroke="#D47090" stroke-width="0.9" opacity="0.5"/>
      <path d="M67 47 Q71 50 75 47" fill="none" stroke="#D47090" stroke-width="0.9" opacity="0.5"/>
    </g>
    <g id="p-dark" opacity="0">
      <ellipse cx="49" cy="45" rx="7" ry="4" fill="#D47090" opacity="0.2"/>
      <ellipse cx="71" cy="45" rx="7" ry="4" fill="#D47090" opacity="0.2"/>
    </g>
    <g id="p-xeyes" opacity="0">
      <line x1="45" y1="38" x2="53" y2="46" stroke="#2A1A1F" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="53" y1="38" x2="45" y2="46" stroke="#2A1A1F" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="67" y1="38" x2="75" y2="46" stroke="#2A1A1F" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="75" y1="38" x2="67" y2="46" stroke="#2A1A1F" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <ellipse id="p-halo" cx="60" cy="17" rx="20" ry="5" fill="none" stroke="#FFD700" stroke-width="2" opacity="0"/>
  </svg>
  <div id="pig-label">loading...</div>
</div>

<div class="total-card" id="total-card" style="display:none">
  <div>
    <div class="total-label">Screen time today</div>
    <div class="total-val" id="total-val">0</div>
    <div class="total-sub" id="total-sub">across 0 sites</div>
  </div>
  <div class="decay-ring">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#3D2530" stroke-width="5"/>
      <circle id="ring-fill" cx="28" cy="28" r="22" fill="none" stroke="#F4A0B5"
        stroke-width="5" stroke-dasharray="138" stroke-dashoffset="138"
        stroke-linecap="round" style="transition:stroke-dashoffset 0.6s ease"/>
    </svg>
    <div class="decay-pct" id="ring-pct">0%</div>
  </div>
</div>

<div id="sites-section" style="display:none">
  <div class="section-label">Top sites</div>
  <div id="sites-list"></div>
</div>

<div class="verdict" id="verdict" style="display:none"></div>

<button class="open-btn" id="open-btn">Open Piggy</button>

<script src="popup.js"></script>
</body>
</html>
